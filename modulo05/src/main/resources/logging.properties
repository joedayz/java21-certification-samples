# Configuración de logging para modulo05
# Usar con: -Djava.util.logging.config.file=src/main/resources/logging.properties

# Handlers globales (root logger)
handlers=java.util.logging.ConsoleHandler

# Handlers específicos para el paquete org.example.logging
org.example.logging.handlers=java.util.logging.FileHandler

# Nivel global por defecto
.level=INFO

# Nivel para el paquete org.example.logging
org.example.logging.level=FINE

# Configuración del ConsoleHandler
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# Configuración del FileHandler
java.util.logging.FileHandler.pattern=%h/java%u.log
java.util.logging.FileHandler.limit=50000
java.util.logging.FileHandler.count=1
java.util.logging.FileHandler.formatter=java.util.logging.XMLFormatter

# Formato personalizado para SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tF %1$tT [%4$s] %2$s - %5$s%6$s%n
